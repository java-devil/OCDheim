<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="75.6 53.6 1102.8 1102.8" overflow="hidden">
  <title>OCDheim — tighter engineering blueprint</title>
  <desc>Symmetrical V on a uniform 92-unit grid. The 644-unit square has its four stroke centerlines exactly halfway between adjacent grid lines. All eight dashed dimension witnesses terminate at their arrow tips. No dimension labels. The central grid axes are subtly emphasized behind the V; no dashed axis crosses the letter. The crop is centered on the frame and displays five grid lines beyond each central axis; each sixth grid line is wholly outside the crop. The V bounds are vertically centered on y605. With positive grid coordinates upward, the top horizontal dimension is at +5 and the bottom at -5.</desc>
